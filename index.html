<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instant English</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    #card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }

    #jp {
      font-size: 18px;
      margin-bottom: 12px;
    }

    #en {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
    }

    button.secondary {
      background: #555;
    }
  </style>
</head>
<body>

  <div id="card">
    <div id="jp">読み込み中…</div>
    <div id="en">タップして答え</div>
  </div>

  <div class="buttons">
    <button id="next">次へ</button>
    <button id="videoOrder" class="secondary">動画順</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
